name: Sync portfolio mobile source

on:
  push:
    paths:
      - .github/workflows/sync-portfolio-mobile.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fetch verified production artifact
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://anselmoacquahit.vercel.app/portfolio/ -o /tmp/portfolio.html
          test "$(sha256sum /tmp/portfolio.html | cut -d' ' -f1)" = "e69848962f53c053e1f6548c5eb1c668b7f6b659282dddb08ab60b212e1d1655"
          mkdir -p portfolio public/portfolio scripts
          cp /tmp/portfolio.html portfolio/index.html
          cp /tmp/portfolio.html public/portfolio/index.html
          printf '%s' '' | base64 --decode > scripts/validate-portfolio-mobile.mjs
          node scripts/validate-portfolio-mobile.mjs
      - name: Commit verified files and remove bootstrap workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio/index.html public/portfolio/index.html scripts/validate-portfolio-mobile.mjs
          git rm .github/workflows/sync-portfolio-mobile.yml
          git commit -m "Improve portfolio mobile icons and motion"
          git push origin main
